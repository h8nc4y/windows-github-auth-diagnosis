name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill repository
    # windows-latest (Windows Server 2025) is intentional and left unpinned:
    # this job only needs pwsh + git, so the runner image migration does not
    # affect it. Pin to a dated label (e.g. windows-2022) only if a future step
    # depends on image-specific preinstalled tooling.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        # checkout@v5 runs on Node.js 24; @v4 ran on Node.js 20, which the runner
        # now flags as deprecated. Bump majors to silence that annotation.
        uses: actions/checkout@v5

      - name: Validate OSS readiness
        shell: pwsh
        run: ./scripts/validate-oss-readiness.ps1

      - name: Test private marker scan
        shell: pwsh
        run: ./scripts/test-scan-private-markers.ps1

      - name: Scan for private markers
        shell: pwsh
        run: ./scripts/scan-private-markers.ps1

      - name: Check whitespace
        shell: pwsh
        run: git diff --check --exit-code

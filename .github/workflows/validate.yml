name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill repository
    # pwsh / Windows PowerShell 5.1 / git に依存するため windows-latest を維持する。
    # image 固有toolへ依存する変更を入れる場合だけ dated label を再検討する。
    runs-on: windows-latest
    # hardened scanner self-test を PS7 / PS5.1 で直列実行する。
    # hosted runner の揺らぎを吸収しつつ、無制限待機は許可しない。
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate OSS readiness
        shell: pwsh
        run: ./scripts/validate-oss-readiness.ps1

      - name: Test private marker scan (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-scan-private-markers.ps1

      - name: Test private marker scan (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-scan-private-markers.ps1

      - name: Scan for private markers
        shell: pwsh
        run: ./scripts/scan-private-markers.ps1

      - name: Check whitespace
        shell: pwsh
        run: ./scripts/check-whitespace.ps1

  validate-ubuntu:
    name: Validate skill repository on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate OSS readiness on Ubuntu
        shell: pwsh
        run: ./scripts/validate-oss-readiness.ps1

      - name: Test private marker scan (PowerShell 7 on Ubuntu)
        shell: pwsh
        run: ./scripts/test-scan-private-markers.ps1

      - name: Scan for private markers on Ubuntu
        shell: pwsh
        run: ./scripts/scan-private-markers.ps1

      - name: Check whitespace on Ubuntu
        shell: pwsh
        run: ./scripts/check-whitespace.ps1
